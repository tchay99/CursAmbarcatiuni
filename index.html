<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curs Conducător de Ambarcațiune cu Motor</title>
  <meta name="description" content="Mini-LMS pentru pregătirea examenului de conducător de ambarcațiune cu motor pentru agrement — curs video de 10 zile narat în română, teste de antrenament din banca oficială și simulare de examen." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛵</text></svg>" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a href="#" id="brandHome" class="brand">
      <span class="brand__logo">⚓</span>
      <span class="brand__text">Curs Ambarcațiuni cu Motor</span>
    </a>
    <div class="topbar__progress">
      <div class="gprogress"><div class="gprogress__bar" id="globalProgressBar"></div></div>
      <span id="globalProgressText" class="gprogress__text">0% finalizat</span>
    </div>
    <span id="userBox" class="userbox" hidden>
      <a id="adminLink" href="/admin" class="userbox__admin" hidden title="Panou de administrare">👑 Admin</a>
      <span id="userEmail" class="userbox__email"></span>
      <button id="logoutBtn" class="btn btn--ghost btn--sm" title="Deconectare">Ieși</button>
    </span>
    <button id="resetBtn" class="btn btn--ghost btn--sm" title="Resetează progresul">Resetează</button>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="Cuprins curs"></aside>
    <main id="main" class="main" aria-live="polite"></main>
  </div>

  <footer class="sitefoot">
    <p>Instrument de studiu neoficial pentru pregătirea examenului. Conținutul este orientativ —
       consultă întotdeauna manualul oficial și legislația în vigoare.</p>
  </footer>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/questions-anr.js"></script>
  <script src="assets/js/player.js"></script>
  <script src="assets/js/practice.js"></script>
  <script src="assets/js/exam.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>

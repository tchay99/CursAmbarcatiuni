<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabla înmulțirii</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Trebuchet MS","DejaVu Sans",sans-serif; min-height:100vh; color:#f1f5f9;
    background:radial-gradient(ellipse 1200px 800px at 25% -10%, #1e293b, #0b1120 70%);
    padding:24px 16px 48px; }
  .wrap { max-width:1000px; margin:0 auto; }
  h1 { text-align:center; font-size:clamp(24px,4vw,38px); letter-spacing:2px; text-transform:uppercase; }
  .sub { text-align:center; margin:10px 0 26px; color:#94a3b8; font-size:clamp(14px,2vw,17px); }
  .player { background:rgba(148,163,184,.08); border:1px solid rgba(148,163,184,.2);
    border-radius:20px; padding:14px; margin-bottom:26px; }
  video { width:100%; border-radius:12px; display:block; background:#000; }
  .now { text-align:center; font-weight:bold; font-size:18px; margin-top:10px; color:#e2e8f0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .chap { border:1px solid rgba(148,163,184,.25); cursor:pointer; border-radius:16px; padding:16px 10px;
    text-align:center; font-family:inherit; font-weight:bold; color:#f1f5f9; font-size:16px;
    background:rgba(148,163,184,.08); transition:transform .15s, box-shadow .15s; }
  .chap:hover { transform:scale(1.05); }
  .chap.active { border-color:#fff; }
  .chap .big { font-size:40px; display:block; margin-bottom:4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Tabla înmulțirii</h1>
  <p class="sub">Alege un capitol. La final, lista completă rămâne pe ecran — repet-o cu voce tare!</p>
  <div class="player">
    <video id="video" controls playsinline></video>
    <div class="now" id="now"></div>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
  const ACCENTS = ["#22d3ee","#a78bfa","#f472b6","#34d399","#fbbf24","#fb7185","#60a5fa","#2dd4bf","#c084fc","#f97316"];
  const grid = document.getElementById("grid");
  const video = document.getElementById("video");
  const now = document.getElementById("now");

  function play(n, scroll) {
    video.src = "../videos/tabla/tabla-" + String(n).padStart(2, "0") + ".mp4";
    now.textContent = "Capitolul " + n + " — înmulțirea cu " + n;
    now.style.color = ACCENTS[n - 1];
    document.querySelectorAll(".chap").forEach((b) => {
      const on = +b.dataset.n === n;
      b.classList.toggle("active", on);
      b.style.boxShadow = on ? "0 0 22px " + ACCENTS[+b.dataset.n - 1] + "66" : "none";
    });
    if (scroll) window.scrollTo({ top: 0, behavior: "smooth" });
    video.play().catch(() => {});
  }

  for (let n = 1; n <= 10; n++) {
    const b = document.createElement("button");
    b.className = "chap";
    b.dataset.n = n;
    b.innerHTML = '<span class="big" style="color:' + ACCENTS[n - 1] + '">× ' + n + "</span>capitolul " + n;
    b.onclick = () => play(n, true);
    grid.appendChild(b);
  }

  // la finalul unui capitol trece singur la următorul
  video.addEventListener("ended", () => {
    const cur = +document.querySelector(".chap.active")?.dataset.n || 0;
    if (cur < 10) play(cur + 1, false);
  });

  play(1, false);
</script>
</body>
</html>
